[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-incident-investigator"
version = "0.1.0"
description = "AI-powered incident investigation agent using LangGraph"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "langgraph>=1.2,<2.0",
    "langchain-openai>=1.0,<2.0",
    "pydantic>=2.14,<3.0",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff>=0.17.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/incident_investigator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests that verify interactions between components",
]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.format]
quote-style = "double"
